<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка URL или файла</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4"><i class="bi bi-shield-lock"></i> Проверка URL или файла</h2>

    <form method="post" enctype="multipart/form-data" class="p-4 bg-white shadow-sm rounded border">
        {% csrf_token %}

        <div class="mb-3">
            <label for="{{ form.url.id_for_label }}" class="form-label">Ссылка (URL)</label>
            {{ form.url }}
        </div>

        <div class="mb-3">
            <label for="{{ form.file.id_for_label }}" class="form-label">Файл для анализа</label>
            {{ form.file }}
        </div>

        <button type="submit" class="btn btn-success">
            🚀 Анализировать
        </button>
    </form>
</div>

</body>
</html>
